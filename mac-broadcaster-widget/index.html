<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDPS Broadcaster Widget</title>
  <style>
    /* macOS Sonoma Dark Glass Widget System */
    :root {
      --mac-bg: rgba(15, 23, 42, 0.94);
      --mac-card: rgba(30, 41, 59, 0.85);
      --mac-border: rgba(255, 255, 255, 0.16);
      --mac-accent: #f59e0b;
      --mac-blue: #2563eb;
      --mac-red: #ef4444;
      --mac-emerald: #10b981;
      --mac-text: #f8fafc;
      --mac-text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a !important;
      color: #f8fafc !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      height: 100vh;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.94));
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.14) inset;
    }

    /* Header Bar */
    .mac-header {
      height: 42px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--mac-border);
      background: rgba(255, 255, 255, 0.04);
      -webkit-app-region: drag;
    }

    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 7px;
      -webkit-app-region: no-drag;
    }

    .traffic-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .dot-close { background: #ff5f56; border: 1px solid #e0443e; }
    .dot-minimize { background: #ffbd2e; border: 1px solid #dea123; }
    .dot-maximize { background: #27c93f; border: 1px solid #1aab29; }

    .header-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
    }

    .status-online {
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.5);
    }

    .status-offline {
      background: rgba(239, 68, 68, 0.25);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .pulse-dot.online { background: #34d399; box-shadow: 0 0 10px #34d399; animation: pulse 1.5s infinite; }
    .pulse-dot.offline { background: #f87171; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Scrollable Container */
    .widget-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .widget-content::-webkit-scrollbar {
      width: 5px;
    }
    .widget-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }

    /* Card Boxes */
    .mac-card {
      background: var(--mac-card);
      border: 1px solid var(--mac-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .card-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Inputs & Selects */
    .ip-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mac-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5) !important;
      border: 1px solid var(--mac-border) !important;
      border-radius: 10px;
      padding: 8px 12px;
      color: #ffffff !important;
      font-family: SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      transition: all 0.2s;
    }

    .mac-input:focus {
      border-color: var(--mac-accent) !important;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-primary:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    /* Push-to-talk Mic Button */
    .mic-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }

    .mic-toggle-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 3px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 12px 30px -5px rgba(37, 99, 235, 0.6);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mic-toggle-btn.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.95);
      animation: micPulse 1s infinite alternate;
    }

    @keyframes micPulse {
      0% { transform: scale(1); border-color: rgba(255, 255, 255, 0.4); }
      100% { transform: scale(1.06); border-color: rgba(255, 255, 255, 1); }
    }

    .mic-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .volume-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 3px;
      overflow: hidden;
    }

    .volume-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      border-radius: 3px;
      transition: width 0.08s ease-out;
    }

    /* Emergency Cancel */
    .btn-emergency {
      width: 100%;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 25px -4px rgba(220, 38, 38, 0.6);
      transition: all 0.15s;
    }

    .btn-emergency:hover {
      filter: brightness(1.2);
      transform: scale(1.01);
    }

    /* Chime Buttons Grid */
    .chime-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .chime-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 10px;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .chime-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .chime-icon {
      font-size: 16px;
    }

    .selector-row {
      display: flex;
      gap: 8px;
    }

    .mac-select {
      flex: 1;
      background: rgba(0, 0, 0, 0.5) !important;
      border: 1px solid var(--mac-border) !important;
      border-radius: 10px;
      padding: 7px 10px;
      color: #ffffff !important;
      font-size: 11px;
      font-weight: 700;
      outline: none;
    }

    /* Toast */
    .toast-bar {
      background: rgba(16, 185, 129, 0.95);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .toast-bar.error {
      background: rgba(239, 68, 68, 0.95);
    }
  </style>
</head>
<body>
  <div className="widget-container" id="widgetApp">
    <!-- macOS Frameless Window Header Bar -->
    <div className="mac-header">
      <div className="traffic-lights">
        <div className="traffic-dot dot-close" id="btnClose" title="Close"></div>
        <div className="traffic-dot dot-minimize" id="btnMinimize" title="Minimize"></div>
        <div className="traffic-dot dot-maximize" id="btnExpand" title="Expand"></div>
      </div>
      <div className="header-title">
        <span>🎙️ SDPS Broadcaster</span>
      </div>
      <div className="status-badge status-offline" id="statusBadge">
        <div className="pulse-dot offline" id="pulseDot"></div>
        <span id="statusText">CHECKING...</span>
      </div>
    </div>

    <!-- Toast Banner -->
    <div className="toast-bar" id="toastBar"></div>

    <!-- Scrollable Widget Content -->
    <div className="widget-content">
      
      <!-- 1. BROADCASTER LOCAL IP SETTINGS -->
      <div className="mac-card">
        <div className="card-title">
          <span>Broadcaster Local IP (LAN)</span>
          <span id="pingMs" style="font-family: monospace; font-size: 9px; color: #94a3b8;">-- ms</span>
        </div>
        <div className="ip-input-group">
          <input 
            type="text" 
            id="ipInput" 
            className="mac-input" 
            placeholder="e.g. 192.168.29.252 or 192.168.1.100" 
            value="192.168.29.252"
          />
          <button className="btn-primary" id="btnSaveIp">
            <span>Save IP</span>
          </button>
        </div>
      </div>

      <!-- 2. PUSH TO TALK LIVE MIC BROADCAST -->
      <div className="mac-card" style="text-align: center;">
        <div className="card-title">
          <span>Live Mic Broadcast (Push-to-Talk)</span>
          <span id="micStatusText" style="color: #34d399; font-size: 9px; font-weight: 800;">Ready</span>
        </div>

        <div className="mic-btn-container">
          <button className="mic-toggle-btn" id="btnMic">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
            <span className="mic-label" id="micBtnLabel">SPEAK NOW</span>
          </button>
          
          <div className="volume-bar-bg">
            <div className="volume-bar-fill" id="volumeFill"></div>
          </div>
        </div>
      </div>

      <!-- 3. EMERGENCY CANCEL ALL -->
      <button className="btn-emergency" id="btnEmergencyCancel">
        <span>🛑 CANCEL ALL BROADCASTS</span>
      </button>

      <!-- 4. INSTANT BELL CHIMES SHORTCUTS -->
      <div className="mac-card">
        <div className="card-title">
          <span>Instant Bell Chimes</span>
          <span style="font-size: 9px; color: #94a3b8;">1-Click Trigger</span>
        </div>
        <div className="chime-grid">
          <button className="chime-btn" data-track="1" data-name="Assembly Bell">
            <span className="chime-icon">🔔</span>
            <span>Assembly Bell</span>
          </button>
          <button className="chime-btn" data-track="2" data-name="Period Bell">
            <span className="chime-icon">⏰</span>
            <span>Period Bell</span>
          </button>
          <button className="chime-btn" data-track="3" data-name="Lunch Chime">
            <span className="chime-icon">🍽️</span>
            <span>Lunch Chime</span>
          </button>
          <button className="chime-btn" data-track="4" data-name="Dispersal Bell">
            <span className="chime-icon">🎓</span>
            <span>Dispersal Bell</span>
          </button>
          <button className="chime-btn" data-track="5" data-name="Emergency Siren">
            <span className="chime-icon">🚨</span>
            <span>Emergency Siren</span>
          </button>
          <button className="chime-btn" data-track="6" data-name="National Anthem">
            <span className="chime-icon">🇮🇳</span>
            <span>National Anthem</span>
          </button>
        </div>
      </div>

      <!-- 5. AUDIO SOURCE & ZONE SELECTION -->
      <div className="mac-card">
        <div className="card-title">
          <span>Target Zone & Audio Source</span>
        </div>
        <div className="selector-row">
          <select id="sourceSelect" className="mac-select">
            <option value="sMic">🎙️ Live Mic (sMic)</option>
            <option value="sFile">📻 MP3 Track (sFile)</option>
            <option value="sAux">🔌 Line-In Aux (sAux)</option>
          </select>
          <select id="zonePreset" className="mac-select">
            <option value="1-200">🏫 All Rooms (1-200)</option>
            <option value="1-50">👶 Primary (1-50)</option>
            <option value="51-120">🎓 Senior (51-120)</option>
            <option value="121-150">⚽ Playground (121-150)</option>
            <option value="151-200">🏢 Admin (151-200)</option>
          </select>
        </div>
      </div>

      <!-- 6. BELL SCHEDULE & TIME SYNC -->
      <div className="mac-card">
        <div className="card-title">
          <span>Schedule Profile & Time Sync</span>
        </div>
        <div className="selector-row">
          <select id="scheduleSelect" className="mac-select">
            <option value="0">☀️ Summer Bell Schedule</option>
            <option value="1">❄️ Winter Bell Schedule</option>
            <option value="2">📝 Exam Schedule</option>
            <option value="4">🔴 Bells Paused (Off)</option>
          </select>
          <button className="btn-primary" id="btnSyncTime" style="padding: 6px 10px; font-size: 10px;">
            <span>⏱️ Sync Time</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
